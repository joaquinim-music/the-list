<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The List</title>
  <style>
    :root {
      --bg: #101116;
      --panel: #181a22;
      --panel-2: #20232d;
      --text: #f2f4f8;
      --muted: #9ba1b0;
      --border: #303441;
      --accent: #7c5cff;
      --up: #35d07f;
      --down: #ff5c72;
      --gold: #ffd75e;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 50% -10%, #28204a 0, transparent 35%),
        var(--bg);
      color: var(--text);
    }

    header {
      padding: 42px 20px 28px;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }

    header h1 {
      margin: 0;
      font-size: clamp(42px, 8vw, 76px);
      letter-spacing: 5px;
      font-weight: 900;
      text-transform: uppercase;
      text-shadow: 0 5px 0 #08090c;
    }

    header p {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 15px;
    }

    main {
      width: min(1000px, calc(100% - 28px));
      margin: 28px auto 60px;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    input, button {
      font: inherit;
    }

    input[type="text"], input[type="number"] {
      flex: 1;
      min-width: 180px;
      padding: 13px 14px;
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 9px;
      outline: none;
    }

    input:focus {
      border-color: var(--accent);
    }

    button {
      border: 0;
      border-radius: 9px;
      padding: 12px 16px;
      color: white;
      background: var(--accent);
      font-weight: 800;
      cursor: pointer;
      transition: transform .12s, filter .12s;
    }

    button:hover { filter: brightness(1.12); }
    button:active { transform: scale(.97); }

    .secondary {
      background: var(--panel-2);
      border: 1px solid var(--border);
    }

    .add-panel {
      display: none;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 18px;
    }

    .add-panel.open { display: block; }

    .add-panel h2 {
      margin: 0 0 12px;
      font-size: 18px;
    }

    .form-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .form-row input { min-width: 160px; }

    .hint {
      color: var(--muted);
      font-size: 12px;
      margin: 10px 0 0;
    }

    .stats {
      color: var(--muted);
      margin: 12px 2px;
      font-size: 13px;
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .level {
      display: grid;
      grid-template-columns: 68px 1fr auto;
      gap: 15px;
      align-items: center;
      background: linear-gradient(90deg, var(--panel), #161820);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 12px;
      min-height: 82px;
    }

    .rank {
      text-align: center;
      font-size: 22px;
      font-weight: 900;
      color: var(--muted);
    }

    .level:first-child .rank { color: var(--gold); }

    .name {
      font-size: 18px;
      font-weight: 900;
      margin-bottom: 5px;
    }

    .meta {
      color: var(--muted);
      font-size: 12px;
    }

    .actions {
      display: flex;
      gap: 7px;
      align-items: center;
    }

    .vote {
      width: 43px;
      height: 43px;
      padding: 0;
      font-size: 20px;
      background: var(--panel-2);
      border: 1px solid var(--border);
    }

    .vote.up:hover {
      border-color: var(--up);
      color: var(--up);
    }

    .vote.down:hover {
      border-color: var(--down);
      color: var(--down);
    }

    .remove {
      margin-left: 4px;
      width: 34px;
      height: 34px;
      padding: 0;
      background: transparent;
      color: #747988;
      font-size: 18px;
    }

    .empty {
      padding: 50px 20px;
      text-align: center;
      color: var(--muted);
      background: var(--panel);
      border: 1px dashed var(--border);
      border-radius: 12px;
    }

    footer {
      text-align: center;
      color: #666b78;
      font-size: 12px;
      padding: 0 20px 30px;
    }

    @media (max-width: 650px) {
      .level {
        grid-template-columns: 48px 1fr;
      }

      .actions {
        grid-column: 2;
      }

      .actions .vote {
        flex: 1;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>The List</h1>
    <p>Anything can be ranked. If it's verified, it can enter.</p>
  </header>

  <main>

    <div class="toolbar">
      <input
        id="search"
        type="text"
        placeholder="Search the list..."
      >

      <button id="addButton">
        ＋ Add Level
      </button>

      <button id="resetButton" class="secondary">
        Reset Demo
      </button>
    </div>

    <section id="addPanel" class="add-panel">

      <h2>Add something to The List</h2>

      <div class="form-row">

        <input
          id="levelName"
          type="text"
          placeholder="Level name"
        >

        <input
          id="levelId"
          type="number"
          placeholder="Level ID"
        >

        <button id="submitLevel">
          Add to The List
        </button>

      </div>

      <p class="hint">
        For this first prototype, "verified" is simply assumed.
        Later we can connect this to actual Geometry Dash data.
      </p>

    </section>

    <div id="stats" class="stats"></div>

    <div id="list" class="list"></div>

  </main>

  <footer>
    The List prototype • Rankings are saved in this browser
  </footer>

  <script>

    const STORAGE_KEY = "the-list-v1";

    const demoLevels = [
      {
        name: "Bloodbath",
        id: 10565740,
        score: 1800
      },

      {
        name: "Cataclysm",
        id: 3975276,
        score: 1740
      },

      {
        name: "Nine Circles",
        id: 428401,
        score: 1540
      },

      {
        name: "Random 5-Star",
        id: 1234567,
        score: 1250
      },

      {
        name: "A Completely Normal Challenge",
        id: 7654321,
        score: 1420
      }
    ];

    let levels = loadLevels();


    function loadLevels() {

      const saved =
        localStorage.getItem(STORAGE_KEY);

      if (saved) {

        try {
          return JSON.parse(saved);
        }

        catch (_) {}

      }

      return demoLevels.map(x => ({
        ...x,
        votes: 0
      }));

    }


    function saveLevels() {

      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(levels)
      );

    }


    function render() {

      const query =
        document
          .getElementById("search")
          .value
          .trim()
          .toLowerCase();

      const list =
        document.getElementById("list");


      levels.sort(
        (a, b) => b.score - a.score
      );


      const visible =
        levels.filter(level =>

          level.name
            .toLowerCase()
            .includes(query)

          ||

          String(level.id)
            .includes(query)

        );


      document.getElementById("stats")
        .textContent =
          `${levels.length} level${
            levels.length === 1 ? "" : "s"
          } • Rankings stored locally`;


      list.innerHTML = "";


      if (!visible.length) {

        list.innerHTML =
          `<div class="empty">
            Nothing found. Add something ridiculous.
          </div>`;

        return;

      }


      visible.forEach(level => {

        const actualRank =
          levels.indexOf(level) + 1;


        const card =
          document.createElement("article");

        card.className = "level";


        card.innerHTML = `

          <div class="rank">
            #${actualRank}
          </div>

          <div>

            <div class="name">
              ${escapeHtml(level.name)}
            </div>

            <div class="meta">
              ID: ${level.id}
              • Rating score: ${Math.round(level.score)}
              • Votes: ${level.votes || 0}
            </div>

          </div>

          <div class="actions">

            <button
              class="vote up"
              title="This is harder"
            >
              ⬆
            </button>

            <button
              class="vote down"
              title="This is easier"
            >
              ⬇
            </button>

            <button
              class="remove"
              title="Remove this level"
            >
              ×
            </button>

          </div>

        `;


        card
          .querySelector(".up")
          .addEventListener(
            "click",
            () => vote(level.id, 1)
          );


        card
          .querySelector(".down")
          .addEventListener(
            "click",
            () => vote(level.id, -1)
          );


        card
          .querySelector(".remove")
          .addEventListener(
            "click",
            () => removeLevel(level.id)
          );


        list.appendChild(card);

      });

    }


    function vote(id, direction) {

      const level =
        levels.find(x => x.id === id);

      if (!level) return;


      level.score +=
        direction * 25;


      level.votes =
        (level.votes || 0) + 1;


      saveLevels();

      render();

    }


    function addLevel() {

      const nameInput =
        document.getElementById("levelName");

      const idInput =
        document.getElementById("levelId");


      const name =
        nameInput.value.trim();

      const id =
        Number(idInput.value);


      if (
        !name ||
        !Number.isInteger(id) ||
        id <= 0
      ) {

        alert(
          "Enter a level name and a valid numeric ID."
        );

        return;

      }


      if (
        levels.some(
          level => level.id === id
        )
      ) {

        alert(
          "That level is already on The List."
        );

        return;

      }


      const average =
        levels.length

          ?

          levels.reduce(
            (sum, x) =>
              sum + x.score,
            0
          ) / levels.length

          :

          1400;


      levels.push({

        name,

        id,

        score:
          Math.round(average),

        votes: 0

      });


      nameInput.value = "";

      idInput.value = "";


      saveLevels();

      render();

    }


    function removeLevel(id) {

      const level =
        levels.find(x => x.id === id);

      if (!level) return;


      if (
        !confirm(
          `Remove "${level.name}" from The List?`
        )
      ) return;


      levels =
        levels.filter(
          x => x.id !== id
        );


      saveLevels();

      render();

    }


    function resetDemo() {

      if (
        !confirm(
          "Reset The List to the original demo levels?"
        )
      ) return;


      levels =
        demoLevels.map(x => ({
          ...x,
          votes: 0
        }));


      saveLevels();

      render();

    }


    function escapeHtml(text) {

      return text.replace(
        /[&<>"']/g,

        char => ({

          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;"

        }[char])

      );

    }


    document
      .getElementById("addButton")
      .addEventListener(
        "click",
        () => {

          document
            .getElementById("addPanel")
            .classList.toggle("open");

        }
      );


    document
      .getElementById("submitLevel")
      .addEventListener(
        "click",
        addLevel
      );


    document
      .getElementById("resetButton")
      .addEventListener(
        "click",
        resetDemo
      );


    document
      .getElementById("search")
      .addEventListener(
        "input",
        render
      );


    document
      .getElementById("levelId")
      .addEventListener(
        "keydown",
        event => {

          if (event.key === "Enter")
            addLevel();

        }
      );


    document
      .getElementById("levelName")
      .addEventListener(
        "keydown",
        event => {

          if (event.key === "Enter")
            addLevel();

        }
      );


    render();

  </script>

</body>
</html>
